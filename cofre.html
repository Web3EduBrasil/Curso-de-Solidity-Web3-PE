<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interação com Contrato Cofre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #3B3B3B; /* Cor de fundo escura, como pedra */
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAIAAACRXR/mAAAACXBIWXMAAAsTAAALEwEAmpwYAAAApklEQVRYo+3VMQoAIAgE0Pz/v3QoWhgG7aA4027d7E5a8wYAAAAAAAAAAAAAAAAA8G2zNz8/n398Z9qCiJikA2ZkQ3cyotv2zGvJvP1iRPSb45k/eYcZ+SP2yjjvO2Yk/Vljfpn9dYyIznmPmfm/mdk/ZpQZ2R+tiMj+Y0Zk/8kPMyL7z7D8TAbYx0/M580X8/kMAAAAAElFTkSuQmCC'); /* Textura de pedra sutil */
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            image-rendering: pixelated; /* Garante que as imagens de fundo fiquem pixeladas */
        }
        .container {
            background-color: #C6C6C6; /* Cinza claro, como a UI do Minecraft */
            padding: 20px;
            border: 4px solid #585858;
            box-shadow: 0 0 0 4px #000000;
            width: 100%;
            max-width: 550px;
        }
        h1, h2 {
            text-align: center;
            color: #000000;
            text-shadow: 2px 2px #AAAAAA;
            margin-bottom: 25px;
        }
        .card {
            background-color: #8B8B8B;
            border: 4px solid #585858;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 0 4px #000000;
        }
        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            background-color: #7D7D7D;
            color: #DDDDDD;
            border: 2px solid #000000;
            box-shadow: inset -2px -4px 0px 0px #585858, inset 2px 2px 0px 0px #A0A0A0;
            padding: 12px 18px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            text-shadow: 2px 2px #3B3B3B;
        }
        button:hover:not(:disabled) {
            background-color: #878787;
            color: #FFFFAF; /* Cor amarela ao passar o mouse */
        }
        button:active:not(:disabled) {
            box-shadow: inset 2px 2px 0px 0px #585858, inset -2px -4px 0px 0px #A0A0A0;
            padding-top: 14px;
            padding-bottom: 10px;
        }
        button:disabled {
            background-color: #505050;
            color: #9E9E9E;
            cursor: not-allowed;
            text-shadow: 2px 2px #2A2A2A;
            box-shadow: inset -2px -4px 0px 0px #3B3B3B, inset 2px 2px 0px 0px #7D7D7D;
        }
        input[type="text"], input[type="number"] {
            font-family: 'Press Start 2P', cursive;
            width: calc(100% - 24px);
            padding: 12px;
            margin-bottom: 10px;
            font-size: 16px;
            background-color: #000000;
            border: 2px solid #585858;
            color: #FFFFFF;
        }
        #status, #accountInfo, #balanceInfo {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            word-wrap: break-word;
            padding: 10px;
            text-shadow: 2px 2px #000;
        }
        #accountInfo { color: #55FF55; } /* Verde Minecraft */
        #status { color: #FF5555; } /* Vermelho Minecraft */
        #balanceInfo { color: #FFFFFF; }
        hr {
            border: none;
            height: 4px;
            background-color: #585858;
            margin: 20px 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Cofre Inteligente</h1>

        <div class="card">
            <h2>Conexão</h2>
            <button id="connectButton">Conectar Carteira</button>
            <div id="accountInfo"></div>
        </div>

        <div class="card">
            <h2>Depositar Fundos (Público)</h2>
            <input type="number" id="depositAmount" placeholder="Valor em ETH (ex: 0.1)">
            <button id="depositButton">Depositar</button>
        </div>

        <div class="card" id="ownerSection">
            <h2>Área do Dono</h2>
            <button id="balanceButton" disabled>Verificar Saldo do Contrato</button>
            <div id="balanceInfo"></div>
            <hr>
            <input type="text" id="recipientAddress" placeholder="Endereço do destinatário" disabled>
            <input type="number" id="transferAmount" placeholder="Valor em ETH" disabled>
            <button id="transferButton" disabled>Transferir</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // --- CONFIGURAÇÕES DO CONTRATO ---
        const contractAddress = "0x7773F284BeEa6a3BD06390fae38DB5fD9763B1CD";
        const contractABI = [
            { "inputs": [], "name": "depositar", "outputs": [], "stateMutability": "payable", "type": "function" },
            { "inputs": [{ "internalType": "address payable", "name": "destinatario", "type": "address" }, { "internalType": "uint256", "name": "valor", "type": "uint256" }], "name": "transferirPara", "outputs": [], "stateMutability": "payable", "type": "function" },
            { "inputs": [], "stateMutability": "nonpayable", "type": "constructor" },
            { "stateMutability": "payable", "type": "receive" },
            { "inputs": [], "name": "dono", "outputs": [{ "internalType": "address", "name": "", "type": "address" }], "stateMutability": "view", "type": "function" },
            { "inputs": [], "name": "saldoDoContrato", "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" }
        ];

        // --- VARIÁVEIS GLOBAIS ---
        let provider, signer, contract, userAddress, ownerAddress;

        // --- ELEMENTOS DO DOM ---
        const connectButton = document.getElementById('connectButton');
        const depositButton = document.getElementById('depositButton');
        const balanceButton = document.getElementById('balanceButton');
        const transferButton = document.getElementById('transferButton');
        const accountInfo = document.getElementById('accountInfo');
        const balanceInfo = document.getElementById('balanceInfo');
        const status = document.getElementById('status');
        const recipientInput = document.getElementById('recipientAddress');
        const transferAmountInput = document.getElementById('transferAmount');

        // --- FUNÇÕES DE INTERAÇÃO ---

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                return showError("MetaMask não detectado. Por favor, instale a extensão.");
            }
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                
                contract = new ethers.Contract(contractAddress, contractABI, signer);
                
                accountInfo.innerText = `Conectado: ${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                connectButton.innerText = 'Carteira Conectada';
                connectButton.disabled = true;
                showStatus("");
                
                await checkOwner();
            } catch (error) {
                console.error("Erro ao conectar carteira:", error);
                showError("Falha ao conectar a carteira.");
            }
        }

        async function checkOwner() {
            try {
                ownerAddress = await contract.dono();
                if (userAddress.toLowerCase() === ownerAddress.toLowerCase()) {
                    balanceButton.disabled = false;
                    transferButton.disabled = false;
                    recipientInput.disabled = false;
                    transferAmountInput.disabled = false;
                    document.getElementById('ownerSection').style.borderColor = '#FFAA00'; // Destaque para o dono
                } else {
                    showStatus("Você não é o dono. Funções de admin desabilitadas.");
                }
            } catch (error) {
                console.error("Erro ao verificar o dono:", error);
                showError("Não foi possível verificar o dono do contrato.");
            }
        }

        async function deposit() {
            const amount = document.getElementById('depositAmount').value;
            if (!amount || amount <= 0) {
                return showError("Por favor, insira um valor válido para depositar.");
            }
            try {
                showStatus("Abrindo MetaMask para confirmar o depósito...");
                const tx = await contract.depositar({ value: ethers.utils.parseEther(amount) });
                showStatus("Processando transação...");
                await tx.wait();
                showSuccess(`Depósito de ${amount} ETH realizado com sucesso!`);
                document.getElementById('depositAmount').value = '';
            } catch (error) {
                console.error("Erro no depósito:", error);
                showError("Falha ao realizar o depósito.");
            }
        }

        async function checkBalance() {
            try {
                const balance = await contract.saldoDoContrato();
                balanceInfo.innerText = `Saldo atual: ${ethers.utils.formatEther(balance)} ETH`;
            } catch (error) {
                console.error("Erro ao checar saldo:", error);
                showError("Falha ao buscar o saldo.");
            }
        }

        async function transfer() {
            const recipient = recipientInput.value;
            const amount = transferAmountInput.value;
            if (!ethers.utils.isAddress(recipient)) {
                return showError("Endereço do destinatário é inválido.");
            }
            if (!amount || amount <= 0) {
                return showError("Por favor, insira um valor válido para transferir.");
            }
            try {
                showStatus("Abrindo MetaMask para confirmar a transferência...");
                const amountInWei = ethers.utils.parseEther(amount);
                const tx = await contract.transferirPara(recipient, amountInWei);
                showStatus("Processando transferência...");
                await tx.wait();
                showSuccess(`Transferência de ${amount} ETH para ${recipient} realizada com sucesso!`);
                recipientInput.value = '';
                transferAmountInput.value = '';
                await checkBalance(); // Atualiza o saldo
            } catch (error) {
                console.error("Erro na transferência:", error);
                showError("Falha na transferência. Verifique o saldo e os parâmetros.");
            }
        }

        // Funções auxiliares de status
        function showStatus(message) {
            status.style.color = '#FFAA00'; // Laranja
            status.innerText = message;
        }
        function showSuccess(message) {
            status.style.color = '#55FF55'; // Verde
            status.innerText = message;
        }
        function showError(message) {
            status.style.color = '#FF5555'; // Vermelho
            status.innerText = message;
        }

        // --- EVENT LISTENERS ---
        connectButton.addEventListener('click', connectWallet);
        depositButton.addEventListener('click', deposit);
        balanceButton.addEventListener('click', checkBalance);
        transferButton.addEventListener('click', transfer);
    </script>
</body>
</html>
