<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baterias Moura DApp</title>
  <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --moura-blue: #004a91;
      --moura-yellow: #ffd100;
      --light-blue: #f0f6ff;
      --dark-text: #222;
      --light-text: #fff;
      --border-color: #ddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--moura-blue) 0%, #002a5c 100%);
      color: var(--light-text);
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px 20px;
      font-size: 1.8em;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* --- MUDANÇA AQUI --- */
    /* Ajustado para a nova logo */
    header img {
      height: 45px; /* Aumentei um pouco a altura para a proporção */
      /* Removido o 'filter' para mostrar as cores originais */
    }

    main {
      background: var(--light-text);
      color: var(--dark-text);
      max-width: 850px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: var(--moura-blue);
      border-bottom: 2px solid var(--moura-yellow);
      padding-bottom: 5px;
      display: inline-block;
      margin-top: 0;
    }

    input, button {
      padding: 12px 15px;
      margin: 8px 5px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 1em;
      transition: all 0.3s ease;
    }

    input {
      width: calc(50% - 32px); /* Ajuste para caber 2 por linha */
    }

    input:focus {
      border-color: var(--moura-blue);
      box-shadow: 0 0 8px rgba(0, 74, 145, 0.4);
      outline: none;
    }

    button {
      background: var(--moura-blue);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-width: 150px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: #003b7a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #connectButton {
      background: var(--moura-yellow);
      color: var(--moura-blue);
      font-weight: 700;
    }
    #connectButton:hover:not(:disabled) {
      background: #e6bb00;
    }

    #account {
      font-weight: 500;
      color: #555;
      background: var(--light-blue);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .bateria-card {
      background: var(--light-blue);
      border-left: 6px solid var(--moura-blue);
      padding: 15px 20px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: left;
      animation: fadeIn 0.5s ease;
    }
    .bateria-card strong {
      color: var(--moura-blue);
    }

    #status {
      margin-top: 20px;
      font-size: 1.1em;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      display: none; /* Começa oculto */
    }
    #status.success {
      display: block;
      background: #e6f7ec;
      color: #1b8748;
    }
    #status.error {
      display: block;
      background: #fdebee;
      color: #d93025;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 30px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--moura-blue);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none; /* Começa oculto */
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      input {
        width: calc(100% - 32px); /* Inputs em linha única */
      }
      header {
        font-size: 1.4em;
      }
    }

  </style>
</head>
<body>
  
  <header>
    <img src="moura.png" alt="Logo Baterias Moura">
    DApp Baterias Moura
  </header>

  <main>
    <button id="connectButton"><i class="fas fa-wallet"></i> Conectar MetaMask</button>
    <p id="account">Carteira: não conectada</p>
    
    <div id="loader" class="spinner"></div>
    <p id="status"></p>

    <hr>
    
    <h2><i class="fas fa-plus-circle"></i> Adicionar Bateria</h2>
    <div>
      <input type="text" id="tipo" placeholder="Tipo (ex: automotiva)">
      <input type="text" id="uso" placeholder="Uso (ex: carro, moto)">
      <input type="text" id="numeroSerie" placeholder="Número de Série">
      <input type="text" id="dataProd" placeholder="Data de Produção (DD/MM/AAAA)">
      <input type="text" id="lote" placeholder="Lote">
      <br>
      <button id="addButton"><i class="fas fa-save"></i> Cadastrar Bateria</button>
    </div>

    <hr>
    
    <h2><i class="fas fa-search"></i> Consultar Bateria</h2>
    <div>
      <input type="number" id="indexInput" placeholder="Índice da bateria" style="width: 200px;">
      <button id="getButton"><i class="fas fa-search"></i> Buscar</button>
      <div id="bateriaInfo" style="margin-top: 15px;"></div>
    </div>

    <hr>
    
    <h2><i class="fas fa-list-ul"></i> Listar Todas</h2>
    <button id="listarButton"><i class="fas fa-sync-alt"></i> Listar Baterias</button>
    <div id="listaBaterias" style="margin-top: 15px;"></div>

  </main>

  <script>
    // O JavaScript continua o mesmo da versão anterior.
    // Nenhuma alteração foi necessária aqui.
    let web3;
    let contract;
    let userAccount;
    const contractAddress = "0x3b98c8D0A09bf663eC8CE0d458810eA5402A89aF";
    const contractABI = [
      {"inputs": [{"internalType": "string","name": "_tipo","type": "string"},{"internalType": "string","name": "_uso","type": "string"},{"internalType": "string","name": "_numeroSerie","type": "string"},{"internalType": "string","name": "_dataProd","type": "string"},{"internalType": "string","name": "_lote","type": "string"}],"name": "adicionarBateria","outputs": [],"stateMutability": "nonpayable","type": "function"},
      {"inputs": [{"internalType": "uint256","name": "_index","type": "uint256"}],"name": "getBateria","outputs": [{"internalType": "string","name": "tipo","type": "string"},{"internalType": "string","name": "uso","type": "string"},{"internalType": "string","name": "numeroSerie","type": "string"},{"internalType": "string","name": "dataProd","type": "string"},{"internalType": "string","name": "lote","type": "string"}],"stateMutability": "view","type": "function"},
      {"inputs": [],"name": "listar","outputs": [{"components": [{"internalType": "string","name": "tipo","type": "string"},{"internalType": "string","name": "uso","type": "string"},{"internalType": "string","name": "numeroSerie","type": "string"},{"internalType": "string","name": "dataProd","type": "string"},{"internalType": "string","name": "lote","type": "string"}],"internalType": "struct BateriasDefeituosasMoura.Bateria[]","name": "","type": "tuple[]"}],"stateMutability": "view","type": "function"},
      {"inputs": [],"name": "totalBaterias","outputs": [{"internalType": "uint256","name": "","type": "uint256"}],"stateMutability": "view","type": "function"}
    ];

    const connectBtn = document.getElementById('connectButton');
    const addBtn = document.getElementById('addButton');
    const getBtn = document.getElementById('getButton');
    const listBtn = document.getElementById('listarButton');
    const statusEl = document.getElementById('status');
    const loaderEl = document.getElementById('loader');
    const accountEl = document.getElementById('account');

    function showLoader() {
      loaderEl.style.display = 'block';
      statusEl.style.display = 'none'; 
    }

    function hideLoader() {
      loaderEl.style.display = 'none';
    }

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'error' : 'success';
    }

    function disableButtons(loading) {
      addBtn.disabled = loading;
      getBtn.disabled = loading;
      listBtn.disabled = loading;

      if(loading) {
        if (document.activeElement === addBtn) addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cadastrando...';
        if (document.activeElement === getBtn) getBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Buscando...';
        if (document.activeElement === listBtn) listBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Listando...';
      } else {
        addBtn.innerHTML = '<i class="fas fa-save"></i> Cadastrar Bateria';
        getBtn.innerHTML = '<i class="fas fa-search"></i> Buscar';
        listBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Listar Baterias';
      }
    }

    connectBtn.addEventListener('click', async () => {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        try {
          const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
          userAccount = accounts[0];
          accountEl.textContent = "Carteira: " + userAccount.substring(0, 6) + "..." + userAccount.substring(userAccount.length - 4);
          contract = new web3.eth.Contract(contractABI, contractAddress);
          showStatus("✅ Conectado à MetaMask!", false);
          
          connectBtn.innerHTML = '<i class="fas fa-check"></i> Conectado';
          connectBtn.disabled = true;

        } catch (error) {
          console.error(error);
          showStatus("❌ Erro ao conectar MetaMask. O usuário rejeitou?", true);
        }
      } else {
        alert("Por favor, instale o MetaMask!");
      }
    });

    addBtn.addEventListener('click', async () => {
      if (!contract) return alert("Conecte primeiro sua carteira!");
      
      const tipo = document.getElementById('tipo').value;
      const uso = document.getElementById('uso').value;
      const numeroSerie = document.getElementById('numeroSerie').value;
      const dataProd = document.getElementById('dataProd').value;
      const lote = document.getElementById('lote').value;
      
      if (!tipo || !uso || !numeroSerie || !dataProd || !lote) {
        return showStatus("❌ Por favor, preencha todos os campos.", true);
      }
      
      showLoader();
      disableButtons(true);
      
      try {
        await contract.methods.adicionarBateria(tipo, uso, numeroSerie, dataProd, lote)
          .send({ from: userAccount });
        showStatus("✅ Bateria adicionada com sucesso!", false);
        document.getElementById('tipo').value = '';
        document.getElementById('uso').value = '';
        document.getElementById('numeroSerie').value = '';
        document.getElementById('dataProd').value = '';
        document.getElementById('lote').value = '';
      } catch (error) {
        console.error(error);
        showStatus("❌ Erro ao adicionar bateria. Transação rejeitada?", true);
      } finally {
        hideLoader();
        disableButtons(false);
      }
    });

    getBtn.addEventListener('click', async () => {
      const index = document.getElementById('indexInput').value;
      if (!contract) return alert("Conecte primeiro sua carteira!");
      if (index === "") return showStatus("❌ Por favor, insira um índice.", true);

      showLoader();
      disableButtons(true);
      
      try {
        const result = await contract.methods.getBateria(index).call();
        if(result.numeroSerie === "") throw new Error("Índice não encontrado");

        document.getElementById('bateriaInfo').innerHTML = `
          <div class="bateria-card">
            <strong>Índice:</strong> #${index}<br>
            <strong>Tipo:</strong> ${result.tipo}<br>
            <strong>Uso:</strong> ${result.uso}<br>
            <strong>Número de Série:</strong> ${result.numeroSerie}<br>
            <strong>Data Produção:</strong> ${result.dataProd}<br>
            <strong>Lote:</strong> ${result.lote}
          </div>
        `;
        showStatus("✅ Bateria encontrada!", false);
      } catch (error) {
        console.error(error);
        document.getElementById('bateriaInfo').innerHTML = "";
        showStatus("❌ Bateria não encontrada ou erro na consulta.", true);
      } finally {
        hideLoader();
        disableButtons(false);
      }
    });

    listBtn.addEventListener('click', async () => {
      if (!contract) return alert("Conecte primeiro sua carteira!");
      
      showLoader();
      disableButtons(true);
      
      try {
        const baterias = await contract.methods.listar().call();
        const listaDiv = document.getElementById('listaBaterias');
        listaDiv.innerHTML = "";
        
        if (baterias.length === 0) {
          listaDiv.innerHTML = "<p>Nenhuma bateria cadastrada.</p>";
          showStatus("ℹ️ Nenhuma bateria encontrada.", false);
          return;
        }

        baterias.forEach((b, i) => {
          const card = document.createElement('div');
          card.className = "bateria-card";
          card.innerHTML = `
            <strong>#${i}</strong><br>
            <strong>Tipo:</strong> ${b.tipo}<br>
            <strong>Uso:</strong> ${b.uso}<br>
            <strong>Nº Série:</strong> ${b.numeroSerie}<br>
            <strong>Data:</strong> ${b.dataProd}<br>
            <strong>Lote:</strong> ${b.lote}
          `;
          listaDiv.appendChild(card);
        });
        showStatus(`📋 Listagem atualizada. Total: ${baterias.length} baterias.`, false);
      } catch (error) {
        console.error(error);
        showStatus("❌ Erro ao listar baterias.", true);
      } finally {
        hideLoader();
        disableButtons(false);
      }
    });
  </script>
</body>
</html>
