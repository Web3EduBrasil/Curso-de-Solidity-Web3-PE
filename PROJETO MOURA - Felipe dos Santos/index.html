<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gestão de Baterias — UI</title>
    <style>
        :root {
            --blue-900: #062b56;
            /* fundo escuro */
            --blue-600: #1e63b8;
            /* azul principal */
            --blue-400: #57a0ff;
            /* azul claro */
            --yellow: #ffd24d;
            /* detalhe amarelo */
            --glass: rgba(255, 255, 255, 0.06);
            --card-shadow: 0 8px 20px rgba(2, 6, 23, 0.35);
            --radius: 14px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: linear-gradient(180deg, var(--blue-900) 0%, #052a4a 60%);
            color: #eaf3ff
        }

        .app {
            max-width: 1100px;
            margin: 36px auto;
            padding: 28px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            box-shadow: var(--card-shadow);
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start
        }

        /* header / logo area */
        .sidebar {
            padding: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        .logo-placeholder {
            height: 84px;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--blue-600), var(--blue-400));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue-900);
            font-weight: 700;
            font-size: 18px;
            position: relative;
            overflow: hidden
        }

        .logo-placeholder small {
            position: absolute;
            right: 8px;
            top: 8px;
            background: var(--yellow);
            padding: 4px 8px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 11px
        }

        .muted {
            opacity: 0.85;
            color: rgba(234, 243, 255, 0.85)
        }

        .section {
            margin-top: 18px
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px
        }

        input[type=text],
        input[type=number],
        select {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: inherit;
            outline: none
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--blue-600), var(--blue-400));
            color: white;
            box-shadow: 0 6px 18px rgba(30, 99, 184, 0.28)
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--blue-400)
        }

        .accent {
            color: var(--yellow);
            font-weight: 700
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-radius: 10px;
            background: var(--glass);
            margin-bottom: 10px
        }

        /* main area */
        .main {
            padding: 22px;
            background: linear-gradient(180deg, rgba(10, 34, 66, 0.18), rgba(7, 26, 52, 0.12));
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px
        }

        .card {
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.03)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px
        }

        th {
            font-size: 13px;
            color: rgba(234, 243, 255, 0.85)
        }

        .small {
            font-size: 13px;
            color: rgba(234, 243, 255, 0.7)
        }

        footer {
            margin-top: 14px;
            font-size: 13px;
            color: rgba(234, 243, 255, 0.6)
        }

        /* responsiveness */
        @media (max-width:980px) {
            .app {
                grid-template-columns: 1fr;
                max-width: 760px;
                padding: 18px
            }
        }
    </style>
</head>

<body>
    <div class="app" role="application">
        <aside class="sidebar">
            <div class="logo-placeholder" aria-hidden="true">
                <div><img src="https://mlqt0se4pk9p.i.optimole.com/q:85/https://www.autodata.com.br/admin/imagens/noticias/moura-renova-sua-identidade-visual_2371e2403bd0be268c10a44d5429fef0.jpg" alt="" style="width: 100px;"></div>
                <small>Tracker</small>
            </div>

            <div class="section">
                <div style="display:flex;justify-content:space-between;align-items:center; margin-bottom: 10px;">
                    <div>
                        <div class="muted">Contrato</div>
                        <div id="contractAddress" class="small">Nenhum endereço configurado</div>
                    </div>
                </div>
                <button id="connectBtn" class="btn btn-primary">Conectar carteira</button>
            </div>

            <div class="section">
                <div class="stat">
                    <div>
                        <div class="small">Número de baterias</div>
                        <div id="numBaterias" style="font-size:20px;font-weight:700">—</div>
                    </div>
                    <div>
                        <div class="small">Rede</div>
                        <div id="network" class="small">—</div>
                    </div>
                </div>

                <div class="card">
                    <div class="small muted">Ações</div>
                    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
                        <button id="refreshBtn" class="btn btn-ghost">Atualizar lista</button>
                        <button id="quickAddBtn" class="btn btn-primary">Abrir formulário</button>
                    </div>
                </div>
            </div>

            <footer>
                <div class="small">Design moderno — Azul com detalhes em amarelo</div>
            </footer>
        </aside>

        <main class="main">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h2 style="margin:0">Moura Tracker</h2>
                <div class="small">Status: <span id="statusText" class="accent">Desconectado</span></div>
            </div>

            <section class="card" style="margin-bottom:14px">
                <div class="small muted" style="margin-bottom:8px">Formulário — adicionar / alterar bateria</div>
                <form id="batteryForm" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
                    <input type="hidden" id="editIndex" />
                    <div>
                        <label for="tipo">Tipo</label>
                        <input id="tipo" type="text" placeholder="Ex: Li-ion" />
                    </div>
                    <div>
                        <label for="uso">Uso</label>
                        <input id="uso" type="text" placeholder="Ex: Automotivo" />
                    </div>
                    <div>
                        <label for="nr_serie">Número de série</label>
                        <input id="nr_serie" type="text" placeholder="Ex: SN12345" />
                    </div>
                    <div>
                        <label for="dataprod">Data de produção</label>
                        <input id="dataprod" type="text" placeholder="YYYY-MM-DD" />
                    </div>
                    <div style="grid-column:1/3">
                        <label for="lote">Lote</label>
                        <input id="lote" type="text" placeholder="Ex: LOTE-2025-A" />
                    </div>
                    <div style="grid-column:1/3;display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
                        <button type="button" id="submitAdd" class="btn btn-primary">Adicionar</button>
                        <button type="button" id="submitEdit" class="btn btn-ghost">Alterar (por índice)</button>
                        <button type="reset" class="btn">Limpar</button>
                    </div>
                </form>
            </section>

            <section class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div class="small muted">Lista de baterias</div>
                    <div style="display:flex;gap:8px;align-items:center">
                        <input id="indexQuery" type="number" min="0" placeholder="Índice"
                            style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit" />
                        <button id="getByIndexBtn" class="btn btn-ghost">Buscar</button>
                    </div>
                </div>

                <div style="overflow:auto;max-height:420px">
                    <table aria-live="polite">
                        <thead>
                            <tr>
                                <th>Índice</th>
                                <th>Tipo</th>
                                <th>Uso</th>
                                <th>Nr. Série</th>
                                <th>Data</th>
                                <th>Lote</th>
                            </tr>
                        </thead>
                        <tbody id="batteriesTbody">
                            <tr>
                                <td colspan="6" class="small">Nenhum dado carregado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Ethers.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.8.0/ethers.umd.min.js"></script>
    <script>
        // ABI fornecido (copie/cole exatamente do seu contrato)
        const contractABI =
            /* ABI START */
            [
                {
                    "inputs": [
                        {
                            "internalType": "string",
                            "name": "tipo",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "uso",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "nr_serie",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "dataprod",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "lote",
                            "type": "string"
                        }
                    ],
                    "name": "adicionarBateria",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [
                        {
                            "internalType": "uint256",
                            "name": "pos",
                            "type": "uint256"
                        },
                        {
                            "internalType": "string",
                            "name": "tipo",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "uso",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "nr_serie",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "dataprod",
                            "type": "string"
                        },
                        {
                            "internalType": "string",
                            "name": "lote",
                            "type": "string"
                        }
                    ],
                    "name": "alterarBateria",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [
                        {
                            "internalType": "uint256",
                            "name": "index",
                            "type": "uint256"
                        }
                    ],
                    "name": "getBateria",
                    "outputs": [
                        {
                            "components": [
                                {
                                    "internalType": "string",
                                    "name": "tipo",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "uso",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "nr_serie",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "dataprod",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "lote",
                                    "type": "string"
                                }
                            ],
                            "internalType": "struct BateriasPremiumDefeituosas.Bateria",
                            "name": "",
                            "type": "tuple"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "getBaterias",
                    "outputs": [
                        {
                            "components": [
                                {
                                    "internalType": "string",
                                    "name": "tipo",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "uso",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "nr_serie",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "dataprod",
                                    "type": "string"
                                },
                                {
                                    "internalType": "string",
                                    "name": "lote",
                                    "type": "string"
                                }
                            ],
                            "internalType": "struct BateriasPremiumDefeituosas.Bateria[]",
                            "name": "",
                            "type": "tuple[]"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "getNumeroBaterias",
                    "outputs": [
                        {
                            "internalType": "uint256",
                            "name": "",
                            "type": "uint256"
                        }
                    ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ]
        /* ABI END */

        let provider, signer, contract;
        let contractAddress = "0xbaecfC5640d897D2f68Ae873d89B92D3d927Bf1a"; // <--- coloque aqui o endereço do contrato

        // DOM
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const contractAddressEl = document.getElementById('contractAddress');
        const numBateriasEl = document.getElementById('numBaterias');
        const batteriesTbody = document.getElementById('batteriesTbody');
        const refreshBtn = document.getElementById('refreshBtn');
        const quickAddBtn = document.getElementById('quickAddBtn');

        // form
        const tipoEl = document.getElementById('tipo');
        const usoEl = document.getElementById('uso');
        const nrSerieEl = document.getElementById('nr_serie');
        const dataprodEl = document.getElementById('dataprod');
        const loteEl = document.getElementById('lote');
        const submitAdd = document.getElementById('submitAdd');
        const submitEdit = document.getElementById('submitEdit');
        const editIndexEl = document.getElementById('editIndex');
        const getByIndexBtn = document.getElementById('getByIndexBtn');
        const indexQuery = document.getElementById('indexQuery');

        // helpers
        function setStatus(text, connected = false) { statusText.textContent = text; statusText.style.color = connected ? 'var(--yellow)' : 'var(--accent)'; }

        async function connectWallet() {
            if (!window.ethereum) {
                alert('MetaMask não encontrada. Instale uma carteira compatível.');
                return;
            }
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send('eth_requestAccounts', []);
            signer = await provider.getSigner();
            const network = await provider.getNetwork();
            document.getElementById('network').textContent = network.name + ' (' + network.chainId + ')';
            setStatus('Conectado', true);
            connectBtn.textContent = 'Conectado';

            // se o endereço do contrato estiver preenchido no JS acima, inicializa
            if (contractAddress && contractAddress.length > 0) {
                contract = new ethers.Contract(contractAddress, contractABI, signer);
                contractAddressEl.textContent = contractAddress;
                await refreshAll();
            } else {
                contractAddressEl.textContent = 'Defina contractAddress na variável JS';
            }
        }

        async function refreshAll() {
            if (!contract) return;
            try {
                const n = await contract.getNumeroBaterias();
                numBateriasEl.textContent = n.toString();
                const arr = await contract.getBaterias();
                renderList(arr);
            } catch (err) {
                console.error(err);
                alert('Erro ao ler do contrato. Veja o console.');
            }
        }

        function renderList(arr) {
            batteriesTbody.innerHTML = '';
            if (!arr || arr.length === 0) {
                batteriesTbody.innerHTML = '<tr><td colspan="6" class="small">Nenhum dado carregado</td></tr>';
                return;
            }
            arr.forEach((b, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${i}</td><td>${escapeHtml(b.tipo)}</td><td>${escapeHtml(b.uso)}</td><td>${escapeHtml(b.nr_serie)}</td><td>${escapeHtml(b.dataprod)}</td><td>${escapeHtml(b.lote)}</td>`;
                batteriesTbody.appendChild(tr);
            });
        }

        function escapeHtml(text) { if (text == null) return ''; return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        // actions
        submitAdd.addEventListener('click', async () => {
            if (!contract) { alert('Sem contrato inicializado. Defina o endereço do contrato no arquivo.'); return; }
            const tipo = tipoEl.value.trim(); const uso = usoEl.value.trim(); const nr = nrSerieEl.value.trim(); const dataprod = dataprodEl.value.trim(); const lote = loteEl.value.trim();
            if (!tipo || !uso) { alert('Preencha pelo menos Tipo e Uso'); return; }
            try {
                const tx = await contract.adicionarBateria(tipo, uso, nr, dataprod, lote);
                setStatus('Aguardando confirmação de transação...');
                await tx.wait();
                setStatus('Transação confirmada', true);
                await refreshAll();
            } catch (err) { console.error(err); alert('Erro ao enviar transação: ' + (err.message || err)); }
        });

        submitEdit.addEventListener('click', async () => {
            if (!contract) { alert('Sem contrato inicializado. Defina o endereço do contrato no arquivo.'); return; }
            const pos = parseInt(editIndexEl.value || '0');
            const tipo = tipoEl.value.trim(); const uso = usoEl.value.trim(); const nr = nrSerieEl.value.trim(); const dataprod = dataprodEl.value.trim(); const lote = loteEl.value.trim();
            if (isNaN(pos)) { alert('Informe um índice válido no campo oculto de edição (editIndex)'); return; }
            try {
                const tx = await contract.alterarBateria(pos, tipo, uso, nr, dataprod, lote);
                setStatus('Aguardando confirmação de transação...');
                await tx.wait();
                setStatus('Transação confirmada', true);
                await refreshAll();
            } catch (err) { console.error(err); alert('Erro ao enviar transação: ' + (err.message || err)); }
        });

        getByIndexBtn.addEventListener('click', async () => {
            if (!contract) { alert('Sem contrato inicializado.'); return; }
            const idx = parseInt(indexQuery.value);
            if (isNaN(idx)) { alert('Informe um índice válido'); return; }
            try {
                const b = await contract.getBateria(idx);
                // popular formulário para edição rápida
                tipoEl.value = b.tipo; usoEl.value = b.uso; nrSerieEl.value = b.nr_serie; dataprodEl.value = b.dataprod; loteEl.value = b.lote; editIndexEl.value = idx;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) { console.error(err); alert('Erro ao buscar bateria: ' + (err.message || err)); }
        });

        refreshBtn.addEventListener('click', async () => { await refreshAll(); });
        quickAddBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); tipoEl.focus(); });

        connectBtn.addEventListener('click', connectWallet);

        // small UX: if contractAddress is provided externally, try to set contract variable
        (function tryInitFromVar() {
            if (contractAddress && contractAddress.length > 0 && window.ethereum) {
                // will initialize on connect
                contractAddressEl.textContent = contractAddress;
            }
        })();

        // Nota: para usar, coloque o endereço do contrato na variável contractAddress no topo do script.
    </script>
</body>

</html>
