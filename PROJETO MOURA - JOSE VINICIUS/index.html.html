<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Baterias Moura - Suporte ao cliente</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f1f8ff, #fffdf5);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #1a1a1a;
    }

    /* ===================== BANNER ===================== */
    .banner {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      overflow: hidden;
      background-color: #0044a7;
    }

    .banner img {
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: cover;
    }

    /* ===================== CONTEÚDO ===================== */
    .container {
      background: #fff;
      margin-top: 60px;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 720px;
      transition: all 0.3s ease;
    }

    .container:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    h2 {
      color: #0044a7;
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #c9c9c9;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #0044a7;
      box-shadow: 0 0 0 2px rgba(0,68,167,0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0044a7, #ffcc00);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s ease;
    }
    button:hover { filter: brightness(1.1); }

    .result {
      background: #f5f9ff;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 15px;
      color: #0044a7;
      font-weight: 500;
      white-space: pre-wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      font-size: 15px;
    }
    table th {
      background: #0044a7;
      color: white;
      padding: 12px;
      text-align: left;
    }
    table td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .footer {
      text-align: center;
      margin: 60px 0 30px;
      font-size: 14px;
      color: #555;
    }

    /* ===================== RESPONSIVIDADE ===================== */
    @media (min-width: 1024px) {
      .banner img {
        max-height: 320px;
        object-fit: cover;
      }

      .container {
        max-width: 800px;
        padding: 50px;
        margin-top: 70px;
      }

      h2 {
        font-size: 26px;
      }
    }

    @media (max-width: 600px) {
      .banner img {
        max-height: 200px;
      }

      .container {
        padding: 25px;
        margin-top: 35px;
      }

      h2 {
        font-size: 20px;
      }

      input, select {
        font-size: 14px;
      }

      button {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ===================== BANNER ===================== -->
  <div class="banner">
    <img src="img/banner_moura.png" alt="Banner Moura - Registro Blockchain de Baterias Defeituosas">
  </div>

  <!-- ===================== REGISTRO ===================== -->
  <div class="container">
    <h2>📦 Registro de produto</h2>
    <input type="text" id="tipo" placeholder="Nome (ex: Moura AGM 70Ah)">
    <select id="uso">
      <option value="">Tipo de uso</option>
      <option>Automotivo</option>
      <option>Náutico</option>
      <option>Industrial</option>
    </select>
    <input type="text" id="numeroSerie" placeholder="Número de série">
    <input type="date" id="dataProd">
    <input type="text" id="lote" placeholder="Lote de fabricação">
    <button onclick="registrarBateria()">Registrar</button>
    <div class="result" id="resultadoRegistro"></div>
  </div>

  <!-- ===================== LISTAGEM ===================== -->
  <div class="container">
    <h2>📋 Produto(s) defeituoso(s)</h2>
    <button onclick="listarBaterias()">Atualizar lista</button>
    <div class="result" id="resultadoLista"></div>
  </div>

  <div class="footer">
    Sistema Blockchain Moura © 2025 — Ambiente de Teste Arbitrum Sepolia
  </div>

  <!-- ===================== SCRIPT WEB3 ===================== -->
  <script>
    const abi = [
      {
        "inputs": [
          { "internalType": "string", "name": "_tipo", "type": "string" },
          { "internalType": "string", "name": "_uso", "type": "string" },
          { "internalType": "string", "name": "_numeroSerie", "type": "string" },
          { "internalType": "string", "name": "_dataProd", "type": "string" },
          { "internalType": "string", "name": "_lote", "type": "string" }
        ],
        "name": "registrarBateria",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "listar",
        "outputs": [
          {
            "components": [
              { "internalType": "string", "name": "tipo", "type": "string" },
              { "internalType": "string", "name": "uso", "type": "string" },
              { "internalType": "string", "name": "numeroSerie", "type": "string" },
              { "internalType": "string", "name": "dataProd", "type": "string" },
              { "internalType": "string", "name": "lote", "type": "string" }
            ],
            "internalType": "struct BateriasDefeituosasMoura.Bateria[]",
            "name": "",
            "type": "tuple[]"
          }
        ],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    const contratoEndereco = "0x3148819E0CE920273B0446C547C0F6daFC73bD0E"; 
    let web3;
    let contrato;

    window.addEventListener('load', async () => {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        contrato = new web3.eth.Contract(abi, contratoEndereco);
      } else {
        alert("MetaMask não detectado. Instale para usar esta aplicação.");
      }
    });

    async function registrarBateria() {
      const tipo = document.getElementById("tipo").value;
      const uso = document.getElementById("uso").value;
      const numeroSerie = document.getElementById("numeroSerie").value;
      const dataProd = document.getElementById("dataProd").value;
      const lote = document.getElementById("lote").value;

      if (!tipo || !uso || !numeroSerie || !dataProd || !lote) {
        alert("Preencha todos os campos antes de registrar.");
        return;
      }

      const contas = await web3.eth.getAccounts();
      try {
        await contrato.methods
          .registrarBateria(tipo, uso, numeroSerie, dataProd, lote)
          .send({ from: contas[0] });
        document.getElementById("resultadoRegistro").innerText =
          "✅ Bateria registrada com sucesso na blockchain!";
      } catch (erro) {
        document.getElementById("resultadoRegistro").innerText =
          "Erro ao registrar: " + erro.message;
      }
    }

    async function listarBaterias() {
      try {
        const baterias = await contrato.methods.listar().call();
        if (baterias.length === 0) {
          document.getElementById("resultadoLista").innerText =
            "Nenhuma bateria registrada ainda.";
          return;
        }

        let html = `
          <table>
            <tr>
              <th>Tipo</th>
              <th>Uso</th>
              <th>Nº Série</th>
              <th>Data</th>
              <th>Lote</th>
            </tr>
        `;
        baterias.forEach(b => {
          html += `
            <tr>
              <td>${b.tipo}</td>
              <td>${b.uso}</td>
              <td>${b.numeroSerie}</td>
              <td>${b.dataProd}</td>
              <td>${b.lote}</td>
            </tr>
          `;
        });
        html += `</table>`;
        document.getElementById("resultadoLista").innerHTML = html;
      } catch (erro) {
        document.getElementById("resultadoLista").innerText =
          "Erro ao listar baterias: " + erro.message;
      }
    }
  </script>
</body>
</html>
