<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Gerenciador de Baterias Moura</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #020130, #0d0463);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
    }

    .logo-canto {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 130px;
      height: auto;
    }

    .card {
      background: #1e63e2;
      border-radius: 15px;
      max-width: 850px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffbb00;
      font-weight: 600;
    }

    input {
      width: auto;
      padding: 12px 15px;
      margin: 10px 0 20px 0;
      border: 2px solid #ffbb00;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
    }

    button {
      width: auto;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #ffbb00;
      color: #09043d;
    }

    .btn-primary:hover {
      background-color: #b98800;
      transform: scale(1.02);
    }

    #listaBaterias {
      margin-top: 30px;
      max-height: 300px;
      overflow-y: auto;
      background-color: #0b0a5f;
      padding: 15px;
      border-radius: 10px;
    }

    .bateria {
      padding: 10px;
      border-bottom: 1px solid #ffbb00;
      color: #fff;
    }

    .bateria:hover {
      background-color: #ffbb00;
      color: #0b0a5f;
    }

    h3 {
      margin-top: 25px;
      color: #ffbb00;
    }
  </style>
</head>

<body>
  <img src="MOURA.png.PNG" alt="Logo" class="logo-canto">

  <div class="card">
    <h2>Gerenciador de Baterias Moura</h2>
    <button class="btn-primary" onclick="connectWallet()">Conectar Wallet</button>

    <h3>Registrar Nova Bateria</h3>
    <input type="text" id="tipo" placeholder="Tipo" />
    <input type="text" id="uso" placeholder="Uso" />
    <input type="text" id="nzSerie" placeholder="Nº Série" />
    <input type="text" id="dataProd" placeholder="Data de Produção" />
    <input type="text" id="lote" placeholder="Lote" />
    <button class="btn-primary" onclick="cadastrarBateria()">Cadastrar Bateria</button>

    <h3>Listar Baterias</h3>
    <button class="btn-primary" onclick="listarBaterias()">Atualizar Lista</button>
    <div id="listaBaterias"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
  <script>
    const abi = [
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "_tipo",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_uso",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_nrSerie",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_dataProd",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_lote",
				"type": "string"
			}
		],
		"name": "cadastrarBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "getBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "tipo",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "uso",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "nrSerie",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "dataProd",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "lote",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "listar",
		"outputs": [
			{
				"components": [
					{
						"internalType": "string",
						"name": "tipo",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "uso",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "nrSerie",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "dataProd",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "lote",
						"type": "string"
					}
				],
				"internalType": "struct BateriasMoura.Bateria[]",
				"name": "",
				"type": "tuple[]"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]

    const contratoEndereco = "0xEA234002202b93919b0f1eF365cBE9F36d1592e5"; // <-- substitua

    let web3, contrato, conta;

    async function connectWallet() {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        const accounts = await web3.eth.getAccounts();
        conta = accounts[0];
        Swal.fire({ icon: 'success', title: 'Conectado!', html: `<b>${conta}</b>`, timer: 1500, showConfirmButton: false });
        contrato = new web3.eth.Contract(abi, contratoEndereco);
        listarBaterias();
      } else {
        Swal.fire({ icon: 'error', title: 'MetaMask não encontrada!', text: 'Use MetaMask ou outro Web3 compatível.' });
      }
    }

    async function cadastrarBateria() {
      const tipo = document.getElementById('tipo').value;
      const uso = document.getElementById('uso').value;
      const nzSerie = document.getElementById('nzSerie').value;
      const dataProd = document.getElementById('dataProd').value;
      const lote = document.getElementById('lote').value;

      if (!tipo || !uso || !nzSerie || !dataProd || !lote) {
        Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
        return;
      }

      try {
        await contrato.methods.cadastrarBateria(tipo, uso, nzSerie, dataProd, lote).send({ from: conta });
        Swal.fire('Sucesso!', 'Bateria cadastrada!', 'success');
        listarBaterias();
      } catch (e) {
        Swal.fire('Erro', e.message, 'error');
      }
    }

    async function listarBaterias() {
      const container = document.getElementById('listaBaterias');
      container.innerHTML = 'Carregando...';

      try {
        const baterias = await contrato.methods.listar().call();

        if (!baterias || baterias.length === 0) {
          container.innerHTML = 'Nenhuma bateria cadastrada.';
          return;
        }

        container.innerHTML = '';
        baterias.forEach((b, i) => {
          const div = document.createElement('div');
          div.className = 'bateria';
          div.innerHTML = `
            <b>#${i + 1}</b> |
            <b>Tipo:</b> ${b.tipo} |
            <b>Uso:</b> ${b.uso} |
            <b>Nº Série:</b> ${b.nrSerie} |
            <b>Data:</b> ${b.dataProd} |
            <b>Lote:</b> ${b.lote}
          `;
          container.appendChild(div);
        });
      } catch (e) {
        console.error(e);
        Swal.fire('Erro', 'Falha ao listar baterias.', 'error');
      }
    }
  </script>
</body>
</html>
