<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baterias Moura DApp</title>
  <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(to right, #004aad, #0061AF);
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      font-size: 1.5em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    header img {
      height: 45px;
    }
    main {
      background: #fff;
      color: #333;
      max-width: 850px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    h2 {
      color: #004aad;
      border-left: 6px solid #F9B400;
      padding-left: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }
    input, button {
      padding: 10px 12px;
      margin: 6px;
      border-radius: 10px;
      font-size: 1em;
    }
    input {
      border: 1px solid #ccc;
      width: 250px;
      transition: box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      box-shadow: 0 0 8px rgba(0,74,173,0.4);
    }
    button {
      background: #004aad;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover {
      background: #0068d7;
      transform: translateY(-1px);
    }
    .bateria-card {
      background: #f0f4ff;
      border-left: 6px solid #F9B400;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #004aad;
    }
    footer {
      background: rgba(0,0,0,0.2);
      color: #fff;
      padding: 15px;
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      border-top: 1px solid #ccc;
    }
    hr {
      border: none;
      border-top: 2px dashed #ccc;
      margin: 25px 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="./Moura-logo.jpg" alt="Bateria Moura">
    DApp de Baterias Descartáveis Moura
  </header>

  <main>
    <button id="connectButton"><i class="fa-solid fa-wallet"></i> Conectar MetaMask</button>
    <p id="account">Carteira: não conectada</p>

    <hr>
    <h2><i class="fa-solid fa-plus-circle" style="color:#F9B400;"></i> Adicionar Bateria</h2>
    <div>
      <input type="text" id="tipo" placeholder="Tipo (ex: automotiva)">
      <input type="text" id="uso" placeholder="Uso (ex: tempo de uso)">
      <input type="text" id="numeroSerie" placeholder="Número de Série">
      <input type="date" id="dataProd" placeholder="Data de Produção">
      <input type="text" id="lote" placeholder="Lote">
      <br>
      <button id="addButton"><i class="fa-solid fa-upload"></i> Cadastrar</button>
    </div>

    <hr>
    <h2><i class="fa-solid fa-magnifying-glass" style="color:#F9B400;"></i> Consultar Bateria</h2>
    <div>
      <input type="number" id="indexInput" placeholder="Índice da bateria">
      <button id="getButton"><i class="fa-solid fa-search"></i> Buscar</button>
      <div id="bateriaInfo"></div>
    </div>

    <hr>
    <h2><i class="fa-solid fa-list" style="color:#F9B400;"></i> Listar Todas</h2>
    <button id="listarButton"><i class="fa-solid fa-clipboard-list"></i> Listar Baterias</button>
    <div id="listaBaterias"></div>

    <p id="status"></p>
    <footer>
      Desenvolvido por: <strong>Marcelo Augusto</strong>
    </footer>
  </main>

  <script>
    let web3;
    let contract;
    let bateriasLocal = [];

    const contractAddress = "0x3b98c8D0A09bf663eC8CE0d458810eA5402A89aF";
    const contractABI = [
      {
        "inputs":[
          {"internalType":"string","name":"_tipo","type":"string"},
          {"internalType":"string","name":"_uso","type":"string"},
          {"internalType":"string","name":"_numeroSerie","type":"string"},
          {"internalType":"string","name":"_dataProd","type":"string"},
          {"internalType":"string","name":"_lote","type":"string"}
        ],
        "name":"adicionarBateria","outputs":[],"stateMutability":"nonpayable","type":"function"
      },
      {
        "inputs":[{"internalType":"uint256","name":"_index","type":"uint256"}],
        "name":"getBateria",
        "outputs":[
          {"internalType":"string","name":"tipo","type":"string"},
          {"internalType":"string","name":"uso","type":"string"},
          {"internalType":"string","name":"numeroSerie","type":"string"},
          {"internalType":"string","name":"dataProd","type":"string"},
          {"internalType":"string","name":"lote","type":"string"}
        ],
        "stateMutability":"view","type":"function"
      },
      {
        "inputs":[],"name":"totalBaterias","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],
        "stateMutability":"view","type":"function"
      }
    ];

    document.getElementById('connectButton').addEventListener('click', async () => {
      if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        try {
          const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
          const account = accounts[0];
          document.getElementById('account').textContent = "Carteira: " + account;
          contract = new web3.eth.Contract(contractABI, contractAddress);
          document.getElementById('status').textContent = "✅ Conectado à MetaMask!";

          const total = await contract.methods.totalBaterias().call();
          bateriasLocal = [];
          for (let i = 0; i < total; i++) {
            const b = await contract.methods.getBateria(i).call();
            bateriasLocal.push(b);
          }
          document.getElementById('status').textContent += ` ⚡ ${total} baterias carregadas!`;

        } catch (error) {
          console.error(error);
          document.getElementById('status').textContent = "❌ Erro ao conectar MetaMask.";
        }
      } else {
        alert("Por favor, instale o MetaMask!");
      }
    });

    document.getElementById('addButton').addEventListener('click', async () => {
      if (!contract) return alert("Conecte primeiro sua carteira!");
      const tipo = document.getElementById('tipo').value;
      const uso = document.getElementById('uso').value;
      const numeroSerie = document.getElementById('numeroSerie').value;
      const dataProd = document.getElementById('dataProd').value;
      const lote = document.getElementById('lote').value;

      if (!tipo || !uso || !numeroSerie || !dataProd || !lote) return alert("Preencha todos os campos!");

      const accounts = await web3.eth.getAccounts();
      try {
        await contract.methods.adicionarBateria(tipo, uso, numeroSerie, dataProd, lote)
          .send({ from: accounts[0] });

        bateriasLocal.push({ tipo, uso, numeroSerie, dataProd, lote });
        document.getElementById('status').textContent = "✅ Bateria adicionada e sincronizada!";
      } catch (error) {
        console.error(error);
        document.getElementById('status').textContent = "❌ Erro ao adicionar bateria.";
      }
    });

    document.getElementById('getButton').addEventListener('click', async () => {
      const index = document.getElementById('indexInput').value;
      if (index === "") return alert("Informe o índice da bateria!");

      try {
        let result = bateriasLocal[index];
        if (!result && contract) {
          result = await contract.methods.getBateria(index).call();
        }

        if (result) {
          document.getElementById('bateriaInfo').innerHTML = `
            <div class="bateria-card">
              <strong>Tipo:</strong> ${result.tipo}<br>
              <strong>Uso:</strong> ${result.uso}<br>
              <strong>Número de Série:</strong> ${result.numeroSerie}<br>
              <strong>Data Produção:</strong> ${result.dataProd}<br>
              <strong>Lote:</strong> ${result.lote}
            </div>
          `;
        } else {
          document.getElementById('bateriaInfo').innerHTML = "<p>❌ Bateria não encontrada.</p>";
        }
      } catch (error) {
        console.error(error);
        document.getElementById('bateriaInfo').innerHTML = "<p>❌ Erro ao buscar bateria.</p>";
      }
    });

    document.getElementById('listarButton').addEventListener('click', () => {
      const listaDiv = document.getElementById('listaBaterias');
      listaDiv.innerHTML = "";
      if (bateriasLocal.length === 0) {
        listaDiv.innerHTML = "<p>Nenhuma bateria cadastrada.</p>";
        return;
      }
      bateriasLocal.forEach((b, i) => {
        const card = document.createElement('div');
        card.className = "bateria-card";
        card.innerHTML = `
          <strong>#${i}</strong><br>
          Tipo: ${b.tipo}<br>
          Uso: ${b.uso}<br>
          Nº Série: ${b.numeroSerie}<br>
          Data: ${b.dataProd}<br>
          Lote: ${b.lote}
        `;
        listaDiv.appendChild(card);
      });
      document.getElementById('status').textContent = `📋 Total: ${bateriasLocal.length} baterias.`;
    });
  </script>
</body>
</html>
