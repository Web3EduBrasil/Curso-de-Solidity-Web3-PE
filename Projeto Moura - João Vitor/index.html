<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Gerenciador de Baterias</title>
<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
</head>
<body>
<h2>Gerenciador de Baterias</h2>

<!-- Botão para conectar wallet -->
<button id="connectWalletBtn" onclick="connectWallet()">Conectar Wallet</button>
<p id="walletStatus">Wallet não conectada</p>

<h3>Cadastrar Nova Bateria</h3>
<form id="cadastrarForm">
  Tipo: <input type="text" id="tipo" required /><br/>
  Uso: <input type="text" id="uso" required /><br/>
  Número de Série: <input type="text" id="numSerie" required /><br/>
  Data de Produção: <input type="text" id="dataProd" placeholder="AAAA-MM-DD" required /><br/>
  Lote: <input type="text" id="lote" required /><br/>
  <button type="submit">Cadastrar</button>
</form>

<h3>Lista de Baterias</h3>
<button onclick="listarBaterias()">Atualizar Lista</button>
<ul id="listaBaterias"></ul>

<h3>Edição de Bateria</h3>
<form id="editarForm">
  Índice: <input type="number" id="indexEdit" required />
  <button type="button" onclick="loadBateria()">Carregar</button><br/><br/>
  Tipo: <input type="text" id="tipoEdit" /><br/>
  Uso: <input type="text" id="usoEdit" /><br/>
  Número de Série: <input type="text" id="numSerieEdit" /><br/>
  Data de Produção: <input type="text" id="dataProdEdit" placeholder="AAAA-MM-DD" /><br/>
  Lote: <input type="text" id="loteEdit" /><br/>
  <button type="button" onclick="setTipo()">Atualizar Tipo</button>
  <button type="button" onclick="setUso()">Atualizar Uso</button>
  <button type="button" onclick="setNumSerie()">Atualizar Num Série</button>
  <button type="button" onclick="setDataProd()">Atualizar Data</button>
  <button type="button" onclick="setLote()">Atualizar Lote</button>
</form>

<script>
  let provider, signer, contract;
  const contractAddress = "0x7109c70082008E8A9D662bBB36Eb148Bb25c228B"; // coloque aqui seu endereço de contrato
  const abi = [
	{
		"inputs": [
			{
				"internalType": "string",
				"name": "_tipo",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_uso",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_num_serie",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_data_prod",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "_lote",
				"type": "string"
			}
		],
		"name": "cadastrarBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "_data_prod",
				"type": "string"
			}
		],
		"name": "setDataProdBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "_lote",
				"type": "string"
			}
		],
		"name": "setLoteBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "_num_serie",
				"type": "string"
			}
		],
		"name": "setNumSerieBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "_tipo",
				"type": "string"
			}
		],
		"name": "setTipoBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "_uso",
				"type": "string"
			}
		],
		"name": "setUsoBateria",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "baterias",
		"outputs": [
			{
				"internalType": "string",
				"name": "tipo",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "uso",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "num_serie",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "data_prod",
				"type": "string"
			},
			{
				"internalType": "string",
				"name": "lote",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			}
		],
		"name": "getDataProdBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			}
		],
		"name": "getLoteBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			}
		],
		"name": "getNumSerieBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			}
		],
		"name": "getTipoBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_index",
				"type": "uint256"
			}
		],
		"name": "getUsoBateria",
		"outputs": [
			{
				"internalType": "string",
				"name": "",
				"type": "string"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "listarBaterias",
		"outputs": [
			{
				"components": [
					{
						"internalType": "string",
						"name": "tipo",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "uso",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "num_serie",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "data_prod",
						"type": "string"
					},
					{
						"internalType": "string",
						"name": "lote",
						"type": "string"
					}
				],
				"internalType": "struct Bateria.Cadastro[]",
				"name": "",
				"type": "tuple[]"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

  // Função para conectar a wallet
  async function connectWallet() {
    try {
      if (!window.ethereum) {
        alert("MetaMask não encontrada");
        return;
      }
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      document.getElementById('walletStatus').innerText = "Wallet conectada: " + (await signer.getAddress()).substring(0,6) + "...";

      // inicializa o contrato com o signer
      contract = new ethers.Contract(contractAddress, abi, signer);
    } catch (err) {
      console.error(err);
      alert('Falha ao conectar wallet');
    }
  }

  // Função para inicializar contrato (usada após conexão)
  async function initialize() {
    if (!signer || !contract) {
      alert("Conecte a sua wallet primeiro");
      throw new Error("Wallet não conectada");
    }
  }

  // Função para cadastrar nova bateria
  document.getElementById('cadastrarForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await initialize();
      await contract.cadastrarBateria(
        document.getElementById('tipo').value,
        document.getElementById('uso').value,
        document.getElementById('numSerie').value,
        document.getElementById('dataProd').value,
        document.getElementById('lote').value
      );
      alert('Bateria cadastrada!');
      listarBaterias();
    } catch (err) {
      console.error(err);
      alert('Erro ao cadastrar');
    }
  });

  // Listar baterias
  async function listarBaterias() {
    try {
      await initialize();
      const baterias = await contract.listarBaterias();
      const ul = document.getElementById('listaBaterias');
      ul.innerHTML = '';
      baterias.forEach((b, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <b>Índice:</b> ${index} -
          <b>Tipo:</b> ${b.tipo} |
          <b>Uso:</b> ${b.uso} |
          <b>Num Série:</b> ${b.num_serie} |
          <b>Data:</b> ${b.data_prod} |
          <b>Lote:</b> ${b.lote}
          <button onclick="editarBateria(${index})">Editar</button>
        `;
        ul.appendChild(li);
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function loadBateria() {
    try {
      await initialize();
      const idx = document.getElementById('indexEdit').value;
      const b = await contract.baterias(idx);
      document.getElementById('tipoEdit').value = b.tipo;
      document.getElementById('usoEdit').value = b.uso;
      document.getElementById('numSerieEdit').value = b.num_serie;
      document.getElementById('dataProdEdit').value = b.data_prod;
      document.getElementById('loteEdit').value = b.lote;
    } catch (err) {
      console.error(err);
      alert('Erro ao carregar bateria');
    }
  }

  async function editarBateria(index) {
    document.getElementById('indexEdit').value = index;
    await loadBateria();
  }

  async function setTipo() {
    try {
      await initialize();
      const index = document.getElementById('indexEdit').value;
      const novoTipo = document.getElementById('tipoEdit').value;
      await contract.setTipoBateria(index, novoTipo);
      alert('Tipo atualizado');
    } catch (err) {
      console.error(err);
    }
  }

  async function setUso() {
    try {
      await initialize();
      const index = document.getElementById('indexEdit').value;
      const novoUso = document.getElementById('usoEdit').value;
      await contract.setUsoBateria(index, novoUso);
      alert('Uso atualizado');
    } catch (err) {
      console.error(err);
    }
  }

  async function setNumSerie() {
    try {
      await initialize();
      const index = document.getElementById('indexEdit').value;
      const novoNumSerie = document.getElementById('numSerieEdit').value;
      await contract.setNumSerieBateria(index, novoNumSerie);
      alert('Num Série atualizado');
    } catch (err) {
      console.error(err);
    }
  }

  async function setDataProd() {
    try {
      await initialize();
      const index = document.getElementById('indexEdit').value;
      const novaData = document.getElementById('dataProdEdit').value;
      await contract.setDataProdBateria(index, novaData);
      alert('Data de produção atualizada');
    } catch (err) {
      console.error(err);
    }
  }

  async function setLote() {
    try {
      await initialize();
      const index = document.getElementById('indexEdit').value;
      const novoLote = document.getElementById('loteEdit').value;
      await contract.setLoteBateria(index, novoLote);
      alert('Lote atualizado');
    } catch (err) {
      console.error(err);
    }
  }

  // Carregar lista ao abrir
  window.onload = () => {
    document.getElementById('walletStatus').innerText = "Wallet não conectada";
  };
</script>

</body>
</html>
